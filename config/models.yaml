# Models under test (D3, D17, D18).
# provider: anthropic | openai_compatible | mock
# Cost: API models use per-million-token prices; self-hosted models use GPU $/hour x seconds per answer.
# CHECK PRICES before publishing results: fill from the provider's pricing page and note the date.

models:
  - id: claude-sonnet
    display: "Claude Sonnet (frontier API)"
    provider: anthropic
    model: claude-sonnet-5-5
    price_in_per_m: null        # USD per 1M input tokens (fill from anthropic.com/pricing)
    price_out_per_m: null
    hosting: "API (US/EU data centres)"

  - id: jais-2-8b
    display: "Jais 2 8B Chat (Inception / G42)"
    provider: openai_compatible
    base_url: http://localhost:8000/v1   # vLLM server started in notebooks/run_open_models.ipynb
    model: inceptionai/Jais-2-8B-Chat    # if 404, try inception42/Jais-2-8B-Chat (check the HF org page)
    precision: bf16
    gpu: "Colab Pro L4/A100"
    gpu_usd_per_hour: null      # fill in: Colab compute-unit cost for the GPU you used
    hosting: "Self-hosted open weights (can run in-country)"

  - id: falcon-h1-arabic-7b
    display: "Falcon-H1-Arabic 7B Instruct (TII)"
    provider: openai_compatible
    base_url: http://localhost:8000/v1
    model: tiiuae/Falcon-H1-Arabic-7B-Instruct   # confirm exact id on huggingface.co/tiiuae
    precision: bf16
    gpu: "Colab Pro L4/A100"
    gpu_usd_per_hour: null
    hosting: "Self-hosted open weights (can run in-country)"

  # Offline stand-in used by tests and for checking the pipeline without any keys
  - id: mock
    display: "Mock (pipeline test only)"
    provider: mock
    model: mock
    enabled_by_default: false
